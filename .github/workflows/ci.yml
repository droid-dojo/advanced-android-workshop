# .github/workflows/ci.yml
name: CI

on:
  pull_request:              # every PR gets the green check
  push:
    branches: ['**']         # ...and every Übungs-Branch stays green on push

# A newer push to the same branch supersedes the running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # plain Linux box - all our suites are JVM-only
    timeout-minutes: 30      # a hanging build must not block the queue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6   # Gradle + dependency caching

      # Stage 1: build
      - name: Build
        run: ./gradlew assembleDebug

      # Stage 2: static analysis - cheap, no device, no network (Modul 12.4)
      - name: Android Lint
        run: ./gradlew lintDebug

      # Stage 3: all JVM test suites (unit + Robolectric UI)
      - name: JVM tests
        run: ./gradlew test

      # Stage 4: visual regressions (both screenshot tools)
      - name: Screenshot verification
        run: ./gradlew verifyRoborazziDebug validateDebugScreenshotTest

      # Artifacts for humans - only when something went red
      - name: Upload reports & screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
